name: 'Ubuntu Root Server (Unified Disk & Domain SSH)'
run-name: 'Ubuntu Root #${{ github.run_number }} - ${{ inputs.keep_alive_minutes }} min'

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'How many minutes to keep alive (5, 60, 180, 360)'
        required: true
        type: string
        default: '60'
      auto_restart:
        description: 'Auto-restart workflow on finish? (yes/no)'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

permissions:
  contents: write
  actions: write

jobs:
  root-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: '1. Connect to Tailscale'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: '2. Maximize and unify disk space'
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Freeing unused disk space for unified root partition ==='
          df -h /
          # Free bloat (Android SDK, dotnet, large pre-installed dev packages)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          echo '=== Disk Space after Cleanup ==='
          df -h /

      - name: '3. Configure direct Root SSH access'
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PASS='Iliya@Runner2026!'

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server zstd git jq curl autossh

          # Set root password and configure SSH for direct root login
          echo "root:$ROOT_PASS" | sudo chpasswd

          sudo install -d -m 0755 /run/sshd
          sudo install -d -m 0755 /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-root-access.conf >/dev/null <<'CONF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          ClientAliveInterval 30
          ClientAliveCountMax 10
          CONF

          sudo sshd -t
          sudo systemctl restart ssh
          sudo systemctl is-active --quiet ssh
          echo 'Root SSH is active and listening.'

      - name: '4. Restore persistent storage and root cache'
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/root-archive.tar.zst
          key: root-home-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            root-home-v1-${{ runner.os }}-
            ubuntu-home-v3-${{ runner.os }}-

      - name: '5. Extract cache and pull Git persistent branch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          ARCHIVE='${{ runner.temp }}/root-archive.tar.zst'

          if [[ -f "$ARCHIVE" ]]; then
            echo 'Extracting compressed root cache...'
            sudo tar -I zstd -xf "$ARCHIVE" -C / || true
          fi

          # Pull Git storage branch directly to /root/projects and /root/.hermes
          TEMP_GIT="/tmp/git-storage-pull"
          rm -rf "$TEMP_GIT"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$TEMP_GIT" 2>/dev/null; then
            echo 'Syncing files from runner-storage branch to /root...'
            sudo mkdir -p /root/projects /root/.hermes
            if [[ -d "$TEMP_GIT/projects" ]]; then
              sudo cp -a "$TEMP_GIT/projects/." /root/projects/ 2>/dev/null || true
            fi
            if [[ -d "$TEMP_GIT/.hermes" ]]; then
              sudo cp -a "$TEMP_GIT/.hermes/." /root/.hermes/ 2>/dev/null || true
            fi
          fi

          sudo mkdir -p /root/projects /root/.local/bin
          sudo chmod 700 /root

      - name: '6. Establish Reverse SSH Tunnel to Server 1 (Domain Access)'
        id: domain-tunnel
        shell: bash
        env:
          TUNNEL_KEY: ${{ secrets.SERVER1_SSH_KEY }}
        run: |
          set -uo pipefail
          if [[ -n "$TUNNEL_KEY" ]]; then
            echo 'Setting up Domain SSH Tunnel to sub.velqon.ir:22022...'
            sudo mkdir -p /root/.ssh
            echo "$TUNNEL_KEY" | sudo tee /root/.ssh/tunnel_id >/dev/null
            sudo chmod 600 /root/.ssh/tunnel_id

            # Start autossh in background to forward Server 1 port 22022 to Runner port 22
            sudo autossh -M 0 -f -N -o "StrictHostKeyChecking=no" -o "ServerAliveInterval=30" -o "ServerAliveCountMax=3" -i /root/.ssh/tunnel_id -R 0.0.0.0:22022:127.0.0.1:22 root@3.148.103.248 || true
            echo 'Domain tunnel established! You can connect via: ssh root@sub.velqon.ir -p 22022'
          else
            echo 'No TUNNEL_KEY provided; skipping domain bridge.'
          fi

      - name: '7. Connection Output'
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1 || echo 'N/A')"
          
          echo "=========================================================="
          echo "🚀 ROOT UBUNTU SERVER READY"
          echo "----------------------------------------------------------"
          echo "User: root"
          echo "Password: Iliya@Runner2026!"
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "SSH Command: ssh root@$TAILSCALE_IP"
          echo "=========================================================="

          {
            echo "## 🚀 Root Server is Ready"
            echo
            echo '```bash'
            echo "ssh -o StrictHostKeyChecking=accept-new root@$TAILSCALE_IP"
            echo '```'
            echo
            echo "- **User:** \`root\`"
            echo "- **Password:** \`Iliya@Runner2026!\`"
            echo "- **Disk Space:** \`$(df -h / | awk 'NR==2{print $4}') free\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ip=$TAILSCALE_IP" >> "$GITHUB_OUTPUT"

      - name: '8. Keep Server Alive'
        shell: bash
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          TOTAL_MINUTES=$((10#$KEEP_ALIVE_MINUTES))
          TOTAL_SECONDS=$((TOTAL_MINUTES * 60))
          DEADLINE=$(( $(date +%s) + TOTAL_SECONDS ))
          CHECK_NUMBER=0

          term_handler() {
            echo 'Cancellation / Stop signal caught! Moving directly to persistent saving...'
            exit 0
          }
          trap term_handler SIGTERM SIGINT

          while (( $(date +%s) < DEADLINE )); do
            CHECK_NUMBER=$((CHECK_NUMBER + 1))
            if ! sudo systemctl is-active --quiet ssh; then
              sudo systemctl restart ssh || true
            fi
            MEMORY="$(free -h | awk '/^Mem:/ {print $3 "/" $2}')"
            DISK="$(df -h / | awk 'NR==2 {print $4 " free"}')"
            LOAD="$(awk '{print $1}' /proc/loadavg)"
            REMAINING_SECONDS=$((DEADLINE - $(date +%s)))
            (( REMAINING_SECONDS < 0 )) && REMAINING_SECONDS=0
            REMAINING_MINUTES=$(( (REMAINING_SECONDS + 59) / 60 ))
            echo "[$CHECK_NUMBER] Remaining=${REMAINING_MINUTES}m | RAM=$MEMORY | Disk=$DISK | Load=$LOAD"
            sleep 60 &
            wait $! || true
          done

      - name: '9. Save data to persistent Git storage branch'
        if: ${{ always() || cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo '=== Saving persistent data to branch runner-storage ==='
          GIT_DIR="/tmp/git-sync"
          rm -rf "$GIT_DIR"
          mkdir -p "$GIT_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$GIT_DIR" 2>/dev/null; then
            cd "$GIT_DIR"
          else
            cd "$GIT_DIR"
            git init
            git checkout -b runner-storage
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          fi

          mkdir -p "$GIT_DIR/projects"
          if sudo test -d /root/projects; then
            sudo cp -a /root/projects/. "$GIT_DIR/projects/" 2>/dev/null || true
          fi

          mkdir -p "$GIT_DIR/.hermes"
          if sudo test -d /root/.hermes; then
            sudo cp -a /root/.hermes/config.yaml "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a /root/.hermes/.env "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a /root/.hermes/memories "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a /root/.hermes/skills "$GIT_DIR/.hermes/" 2>/dev/null || true
          fi

          echo "Last run completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC') by run #${{ github.run_number }}" > "$GIT_DIR/LAST_RUN.txt"

          sudo chown -R "$(id -u):$(id -g)" "$GIT_DIR"
          cd "$GIT_DIR"
          git add -A

          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Auto-save root state from run #${{ github.run_number }}" || true
            git push -u origin runner-storage --force || true
            echo 'Persistent root data saved to runner-storage branch!'
          else
            echo 'Storage already up to date.'
          fi

      - name: '10. Compress and save complete root cache'
        if: ${{ always() || cancelled() }}
        id: prepare-cache
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='${{ runner.temp }}/root-archive.tar.zst'
          rm -f "$ARCHIVE"

          echo 'Compressing /root state with zstd...'
          sudo tar -I 'zstd -3 -T0' --exclude='/root/.cache' -cf "$ARCHIVE" /root || true
          echo "Archive created: $(ls -lh "$ARCHIVE" | awk '{print $5}')"

      - name: '11. Save Actions Cache'
        if: ${{ always() || cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/root-archive.tar.zst
          key: root-home-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: '12. Auto-restart workflow (if enabled)'
        if: ${{ always() && inputs.auto_restart == 'yes' && !cancelled() }}
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          WF_FILE="Ubunutu.yml"
          echo "Triggering auto-restart of $WF_FILE..."
          curl -sS -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"keep_alive_minutes\":\"${{ inputs.keep_alive_minutes }}\",\"auto_restart\":\"yes\"}}" || true
