name: 'Ubuntu SSH over Tailscale v6 (Persistent)'
run-name: 'Ubuntu SSH #${{ github.run_number }} - ${{ inputs.keep_alive_minutes }} min'

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'How many minutes to keep Ubuntu alive (5, 10, 60, 180, 300, etc.)'
        required: true
        type: string
        default: '60'
      auto_restart:
        description: 'Auto-restart this workflow after completion? (yes/no)'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

permissions:
  contents: write
  actions: write

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: '1. Connect to Tailscale'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: '2. Install and configure SSH'
        shell: bash
        run: |
          set -euo pipefail

          SSH_USERNAME='iliya'
          SSH_PASSWORD='Rdp!2024#Secure'

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server zstd git jq curl

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd --create-home --shell /bin/bash "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USERNAME"
          sudo install -d -o "$SSH_USERNAME" -g "$SSH_USERNAME" -m 0755 \
            "/home/$SSH_USERNAME/projects"
          echo "$SSH_USERNAME ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee /etc/sudoers.d/90-github-ssh-user >/dev/null
          sudo chmod 0440 /etc/sudoers.d/90-github-ssh-user

          sudo install -d -m 0755 /run/sshd
          sudo install -d -m 0755 /etc/ssh/sshd_config.d
          printf '%s\n' \
            'PasswordAuthentication yes' \
            'KbdInteractiveAuthentication yes' \
            'PermitRootLogin no' \
            'UsePAM yes' | sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null

          sudo sshd -t
          sudo systemctl restart ssh
          sudo systemctl is-active --quiet ssh

          echo 'SSH server is ready.'

      - name: '3. Restore complete Ubuntu home cache'
        id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hermes-archive.tar.zst
          key: ubuntu-home-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ubuntu-home-v3-${{ runner.os }}-
            ubuntu-home-v2-${{ runner.os }}-

      - name: '4. Extract cache and restore persistent data'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          USER_HOME='/home/iliya'
          ARCHIVE='${{ runner.temp }}/hermes-archive.tar.zst'

          # Layer 1: Restore full cache if available
          if [[ -f "$ARCHIVE" ]]; then
            echo 'Extracting compressed home cache...'
            sudo tar -I zstd -xf "$ARCHIVE" -C /
            echo 'Home cache restored successfully.'
          else
            echo 'No previous full cache found; checking Git persistent storage branch...'
          fi

          # Layer 2: Restore Git storage branch for projects and hermes configs
          TEMP_GIT="/tmp/persistent-storage"
          rm -rf "$TEMP_GIT"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$TEMP_GIT" 2>/dev/null; then
            echo 'Found persistent Git storage branch. Restoring user projects and configs...'
            if [[ -d "$TEMP_GIT/projects" ]]; then
              sudo cp -a "$TEMP_GIT/projects/." "$USER_HOME/projects/"
            fi
            if [[ -d "$TEMP_GIT/.hermes" ]]; then
              sudo mkdir -p "$USER_HOME/.hermes"
              sudo cp -a "$TEMP_GIT/.hermes/." "$USER_HOME/.hermes/"
            fi
            echo 'Git storage sync complete.'
          else
            echo 'No runner-storage branch found yet. Will be initialized on first run completion.'
          fi

          sudo mkdir -p "$USER_HOME/.local/bin" "$USER_HOME/projects"
          sudo chown -R iliya:iliya "$USER_HOME"
          sudo rm -rf "$USER_HOME/.local/state/hermes/gateway-locks"

          if ! sudo grep -Fq 'export PATH="$HOME/.local/bin:$PATH"' "$USER_HOME/.bashrc"; then
            echo 'export PATH="$HOME/.local/bin:$PATH"' | sudo tee -a "$USER_HOME/.bashrc" >/dev/null
          fi

          # Verify or setup Hermes
          if [[ -d "$USER_HOME/.hermes" ]]; then
            if ! sudo -u iliya -H env PATH="$USER_HOME/.local/bin:/usr/local/bin:/usr/bin:/bin" \
              hermes --version >/dev/null 2>&1; then
              echo 'Rebuilding Hermes runtime...'
              sudo rm -rf "$USER_HOME/.hermes/hermes-agent/venv"
              sudo -u iliya -H bash -c \
                'cd "$HOME" && unset VIRTUAL_ENV CONDA_PREFIX UV_PROJECT_ENVIRONMENT && export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin" && curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup'
            fi

            if sudo test -x "$USER_HOME/.local/bin/hermes"; then
              sudo ln -sfn "$USER_HOME/.local/bin/hermes" /usr/local/bin/hermes
            fi
          fi

      - name: '5. Auto-start Hermes messaging gateway'
        shell: bash
        run: |
          set -u
          USER_HOME='/home/iliya'
          USER_SERVICE="$USER_HOME/.config/systemd/user/hermes-gateway.service"
          GATEWAY_CONFIGURED='false'

          if sudo test -f "$USER_SERVICE"; then
            GATEWAY_CONFIGURED='true'
          elif sudo grep -Eiq 'telegram|discord|slack|gateway' \
            "$USER_HOME/.hermes/config.yaml" "$USER_HOME/.hermes/.env" 2>/dev/null; then
            GATEWAY_CONFIGURED='true'
          fi

          if [[ "$GATEWAY_CONFIGURED" != 'true' ]]; then
            echo 'Hermes messaging is not configured; gateway auto-start skipped.'
            exit 0
          fi

          sudo rm -f "$USER_HOME/.config/systemd/user/default.target.wants/hermes-gateway.service"

          sudo tee /etc/systemd/system/hermes-gateway-runner.service >/dev/null <<'UNIT'
          [Unit]
          Description=Hermes Messaging Gateway for GitHub Runner
          After=network-online.target tailscaled.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=iliya
          Group=iliya
          WorkingDirectory=/home/iliya
          Environment=HOME=/home/iliya
          Environment=HERMES_HOME=/home/iliya/.hermes
          Environment=PATH=/home/iliya/.local/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/local/bin/hermes gateway run --external-supervisor
          Restart=always
          RestartSec=5
          KillMode=control-group

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now hermes-gateway-runner.service
          sleep 5

          if sudo systemctl is-active --quiet hermes-gateway-runner.service; then
            sudo systemctl status hermes-gateway-runner.service --no-pager --lines=15
            echo 'Hermes messaging gateway auto-start completed.'
          else
            echo 'WARNING: Hermes system gateway failed; SSH will remain available.'
            sudo journalctl -u hermes-gateway-runner.service --no-pager -n 50 || true
          fi

      - name: '6. Create connection information'
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo 'Tailscale IPv4 address is missing.' >&2
            exit 1
          fi

          CONNECTION_FILE="$RUNNER_TEMP/ubuntu-ssh-connection.txt"
          {
            echo 'UBUNTU SSH CONNECTION'
            echo '====================='
            echo "IP: $TAILSCALE_IP"
            echo 'Port: 22'
            echo 'Username: iliya'
            echo 'Password: Rdp!2024#Secure'
            echo
            echo 'PowerShell / Bash command:'
            echo "ssh -o StrictHostKeyChecking=accept-new iliya@$TAILSCALE_IP"
          } > "$CONNECTION_FILE"

          echo "ip=$TAILSCALE_IP" >> "$GITHUB_OUTPUT"
          echo "file=$CONNECTION_FILE" >> "$GITHUB_OUTPUT"

          {
            echo '## 🚀 Ubuntu SSH is ready'
            echo
            echo '```powershell'
            echo "ssh -o StrictHostKeyChecking=accept-new iliya@$TAILSCALE_IP"
            echo '```'
            echo
            echo '- IP: `'"$TAILSCALE_IP"'`'
            echo '- Username: `iliya`'
            echo '- Password: `Rdp!2024#Secure`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: '7. Output SSH Command'
        shell: bash
        env:
          TAILSCALE_IP: ${{ steps.connection.outputs.ip }}
        run: |
          echo '=================================================================='
          echo "ssh -o StrictHostKeyChecking=accept-new iliya@$TAILSCALE_IP"
          echo 'Password: Rdp!2024#Secure'
          echo '=================================================================='

      - name: '8. Upload SSH connection file'
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ssh-connection-${{ github.run_number }}
          path: ${{ steps.connection.outputs.file }}
          if-no-files-found: ignore
          retention-days: 1

      - name: '9. Keep Ubuntu alive'
        shell: bash
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
          TAILSCALE_IP: ${{ steps.connection.outputs.ip }}
        run: |
          set -euo pipefail
          TOTAL_MINUTES=$((10#$KEEP_ALIVE_MINUTES))
          TOTAL_SECONDS=$((TOTAL_MINUTES * 60))
          DEADLINE=$(( $(date +%s) + TOTAL_SECONDS ))
          CHECK_NUMBER=0

          echo "Ubuntu SSH will remain available for $TOTAL_MINUTES minute(s)."

          # Handle manual cancellation cleanly so subsequent save steps always execute
          term_handler() {
            echo 'SIGTERM / Cancellation detected! Exiting wait loop to trigger data save steps...'
            exit 0
          }
          trap term_handler SIGTERM SIGINT

          while (( $(date +%s) < DEADLINE )); do
            CHECK_NUMBER=$((CHECK_NUMBER + 1))
            if ! sudo systemctl is-active --quiet ssh; then
              sudo systemctl restart ssh || true
            fi
            MEMORY="$(free -h | awk '/^Mem:/ {print $3 "/" $2}')"
            DISK="$(df -h / | awk 'NR==2 {print $4 " free"}')"
            LOAD="$(awk '{print $1}' /proc/loadavg)"
            REMAINING_SECONDS=$((DEADLINE - $(date +%s)))
            (( REMAINING_SECONDS < 0 )) && REMAINING_SECONDS=0
            REMAINING_MINUTES=$(( (REMAINING_SECONDS + 59) / 60 ))
            echo "[$CHECK_NUMBER] Remaining=${REMAINING_MINUTES}m | RAM=$MEMORY | Disk=$DISK | Load=$LOAD"
            sleep 60 &
            wait $! || true
          done

      - name: '10. Save data to persistent Git storage branch'
        if: ${{ always() || cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo '=== Saving persistent data to branch runner-storage ==='
          GIT_DIR="/tmp/git-sync"
          rm -rf "$GIT_DIR"
          mkdir -p "$GIT_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$GIT_DIR" 2>/dev/null; then
            echo 'Creating orphan runner-storage branch...'
            cd "$GIT_DIR"
            git init
            git checkout --orphan runner-storage
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          else
            cd "$GIT_DIR"
          fi

          # Sync projects
          mkdir -p "$GIT_DIR/projects"
          if sudo test -d /home/iliya/projects; then
            sudo cp -a /home/iliya/projects/. "$GIT_DIR/projects/" || true
          fi

          # Sync essential hermes configs and memories (excluding large cache/venv)
          mkdir -p "$GIT_DIR/.hermes"
          if sudo test -d /home/iliya/.hermes; then
            sudo rsync -av --exclude 'hermes-agent' --exclude 'cache' --exclude 'venvs' /home/iliya/.hermes/ "$GIT_DIR/.hermes/" 2>/dev/null || sudo cp -a /home/iliya/.hermes "$GIT_DIR/" || true
          fi

          sudo chown -R "$(id -u):$(id -g)" "$GIT_DIR"
          cd "$GIT_DIR"
          git add -A
          if ! git diff-index --quiet HEAD 2>/dev/null; then
            git commit -m "Auto-save runner state from run #${{ github.run_number }}"
            git push -u origin runner-storage --force
            echo 'Persistent user data committed and pushed to runner-storage branch!'
          else
            echo 'No changes in user projects or config; skip git commit.'
          fi

      - name: '11. Compress and prepare full home cache'
        id: prepare-cache
        if: ${{ always() || cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='${{ runner.temp }}/hermes-archive.tar.zst'
          rm -f "$ARCHIVE"

          if sudo test -d /home/iliya; then
            echo 'Compressing /home/iliya with zstd...'
            sudo tar -I 'zstd -3 -T0' -cf "$ARCHIVE" /home/iliya
            echo "Archive created: $(ls -lh "$ARCHIVE" | awk '{print $5}')"
            echo 'should_save=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_save=false' >> "$GITHUB_OUTPUT"
          fi

      - name: '12. Save Actions Cache'
        if: ${{ (always() || cancelled()) && steps.prepare-cache.outputs.should_save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hermes-archive.tar.zst
          key: ubuntu-home-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: '13. Auto-restart workflow (if enabled)'
        if: ${{ always() && inputs.auto_restart == 'yes' }}
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WF_FILE="Ubunutu.yml"
          echo "Triggering new run of $WF_FILE..."

          HTTP_CODE=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"keep_alive_minutes\":\"${{ inputs.keep_alive_minutes }}\",\"auto_restart\":\"yes\"}}")

          echo "Dispatch response HTTP: $HTTP_CODE"
          if [[ "$HTTP_CODE" == "204" ]]; then
            echo "Auto-restart triggered successfully."
          else
            cat /tmp/dispatch.json || true
          fi
