name: 'Debian 5TB Cloud Server (16GB RAM, 5TB Google Drive & Domain SSH)'
run-name: 'Debian 5TB #${{ github.run_number }} - ${{ inputs.keep_alive_minutes }} min'

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'How many minutes to keep alive (default 350 min = ~6 hours)'
        required: true
        type: string
        default: '350'
      auto_restart:
        description: 'Auto-restart workflow on finish? (yes/no)'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

permissions:
  contents: write
  actions: write

jobs:
  root-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: '1. Connect to Tailscale'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: '2. Maximize disk space'
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Freeing unused packages to maximize local disk ==='
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: '3. Bootstrap pure Debian environment'
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PASS='Iliya@Runner2026!'

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq debootstrap openssh-server zstd git jq curl autossh rclone fuse3

          TARGET_DIR="/debian-root"
          sudo mkdir -p "$TARGET_DIR"

          echo 'Bootstrapping Debian Bookworm/Trixie...'
          sudo debootstrap --variant=minbase --include=bash,coreutils,util-linux,iproute2,iputils-ping,procps,net-tools,nano,curl,wget,ca-certificates,git,python3,python3-pip,openssh-server,sudo,zstd,locales,rclone,fuse3 trixie "$TARGET_DIR" http://deb.debian.org/debian

          for fs in dev dev/pts proc sys run; do
            sudo mount --bind "/$fs" "$TARGET_DIR/$fs"
          done

          # Configure Debian root
          echo "root:$ROOT_PASS" | sudo chroot "$TARGET_DIR" chpasswd -c SHA512
          sudo chroot "$TARGET_DIR" usermod -s /bin/bash root

          sudo mkdir -p "$TARGET_DIR/run/sshd" "$TARGET_DIR/etc/ssh" "$TARGET_DIR/root/projects" "$TARGET_DIR/root/gdrive" "$TARGET_DIR/root/.config/rclone"

          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/g' "$TARGET_DIR/etc/ssh/sshd_config" 2>/dev/null || true
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/g' "$TARGET_DIR/etc/ssh/sshd_config" 2>/dev/null || true

          sudo tee "$TARGET_DIR/etc/ssh/sshd_config.d/01-direct-root.conf" >/dev/null <<'CONF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM no
          CONF

          echo "debian-5tb-runner" | sudo tee "$TARGET_DIR/etc/hostname" >/dev/null
          echo "127.0.0.1 localhost debian-5tb-runner" | sudo tee "$TARGET_DIR/etc/hosts" >/dev/null

          # Start Debian sshd on port 2222
          sudo chroot "$TARGET_DIR" /usr/sbin/sshd -p 2222
          sleep 2
          echo 'Debian SSH listening on port 2222'

      - name: '4. Mount 5TB Google Drive'
        shell: bash
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_GDRIVE_CONF }}
        run: |
          set -uo pipefail
          TARGET_DIR="/debian-root"

          if [[ -n "$RCLONE_CONF" ]]; then
            echo 'Configuring 5TB Google Drive in host and Debian...'
            mkdir -p /root/.config/rclone "$TARGET_DIR/root/.config/rclone"
            echo "$RCLONE_CONF" | sudo tee /root/.config/rclone/rclone.conf >/dev/null
            echo "$RCLONE_CONF" | sudo tee "$TARGET_DIR/root/.config/rclone/rclone.conf" >/dev/null

            sudo mkdir -p /mnt/gdrive "$TARGET_DIR/root/gdrive"

            # Allow other users / fuse mount
            sudo sed -i 's/^#*user_allow_other/user_allow_other/g' /etc/fuse.conf 2>/dev/null || true

            echo 'Mounting Google Drive with VFS caching...'
            sudo rclone mount gdrive: /mnt/gdrive \
              --allow-other \
              --vfs-cache-mode full \
              --vfs-cache-max-age 24h \
              --vfs-read-chunk-size 64M \
              --buffer-size 128M \
              --daemon

            sleep 3
            # Bind mount to Debian /root/gdrive
            sudo mount --bind /mnt/gdrive "$TARGET_DIR/root/gdrive"
            df -h /mnt/gdrive || true
            echo '5TB Google Drive successfully mounted at /root/gdrive!'
          else
            echo 'No RCLONE_CONF secret found, skipping drive mount.'
          fi

      - name: '5. Restore persistent storage and root cache'
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/root-archive.tar.zst
          key: debian-root-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            debian-root-v1-${{ runner.os }}-
            root-home-v1-${{ runner.os }}-

      - name: '6. Extract cache and pull Git persistent branch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TARGET_DIR="/debian-root"
          ARCHIVE='${{ runner.temp }}/root-archive.tar.zst'

          if [[ -f "$ARCHIVE" ]]; then
            echo 'Extracting compressed Debian root cache...'
            sudo tar -I zstd -xf "$ARCHIVE" -C "$TARGET_DIR" || true
          fi

          TEMP_GIT="/tmp/git-storage-pull"
          rm -rf "$TEMP_GIT"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$TEMP_GIT" 2>/dev/null; then
            echo 'Syncing files from runner-storage branch into Debian /root/projects...'
            sudo mkdir -p "$TARGET_DIR/root/projects" "$TARGET_DIR/root/.hermes"
            if [[ -d "$TEMP_GIT/projects" ]]; then
              sudo cp -a "$TEMP_GIT/projects/." "$TARGET_DIR/root/projects/" 2>/dev/null || true
            fi
            if [[ -d "$TEMP_GIT/.hermes" ]]; then
              sudo cp -a "$TEMP_GIT/.hermes/." "$TARGET_DIR/root/.hermes/" 2>/dev/null || true
            fi
          fi

      - name: '7. Establish Reverse SSH Tunnel to Server 1 (Domain Access)'
        id: domain-tunnel
        shell: bash
        env:
          TUNNEL_KEY: ${{ secrets.SERVER1_SSH_KEY }}
        run: |
          set -uo pipefail
          if [[ -n "$TUNNEL_KEY" ]]; then
            echo 'Setting up Domain SSH Tunnel to sub.velqon.ir:22022...'
            sudo mkdir -p /root/.ssh
            echo "$TUNNEL_KEY" | sudo tee /root/.ssh/tunnel_id >/dev/null
            sudo chmod 600 /root/.ssh/tunnel_id

            # Forward Server 1 port 22022 -> Debian SSH port 2222
            sudo autossh -M 0 -f -N -o "StrictHostKeyChecking=no" -o "ServerAliveInterval=30" -o "ServerAliveCountMax=3" -i /root/.ssh/tunnel_id -R 0.0.0.0:22022:127.0.0.1:2222 root@3.148.103.248 || true
            echo 'Domain tunnel established! You can connect via: ssh root@sub.velqon.ir -p 22022'
          fi

      - name: '8. Connection Output'
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1 || echo 'N/A')"
          
          echo "=========================================================="
          echo "🚀 DEBIAN 5TB ROOT SERVER READY"
          echo "----------------------------------------------------------"
          echo "OS: Debian GNU/Linux 13 (Trixie)"
          echo "User: root"
          echo "Password: Iliya@Runner2026!"
          echo "Storage: 100GB+ SSD Local + 5TB Cloud (/root/gdrive)"
          echo "Domain SSH: ssh -p 22022 root@sub.velqon.ir"
          echo "Tailscale SSH: ssh root@$TAILSCALE_IP"
          echo "=========================================================="

          {
            echo "## 🚀 Debian 5TB Root Server is Ready"
            echo
            echo '### 🌐 Direct Domain SSH (No Tailscale Needed):'
            echo '```bash'
            echo "ssh -o StrictHostKeyChecking=accept-new -p 22022 root@sub.velqon.ir"
            echo '```'
            echo
            echo '### 🔒 Tailscale SSH:'
            echo '```bash'
            echo "ssh -o StrictHostKeyChecking=accept-new root@$TAILSCALE_IP"
            echo '```'
            echo
            echo "- **OS:** \`Debian GNU/Linux 13 (trixie)\`"
            echo "- **User:** \`root\`"
            echo "- **Password:** \`Iliya@Runner2026!\`"
            echo "- **Local Disk:** \`$(df -h / | awk 'NR==2{print $4}') free\`"
            echo "- **Cloud Drive:** \`5 TB Google Drive\` mounted at \`/root/gdrive\`"
            echo "- **Session Duration:** \`350 minutes (~6 hours)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: '9. Keep Server Alive'
        shell: bash
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          TOTAL_MINUTES=$((10#$KEEP_ALIVE_MINUTES))
          TOTAL_SECONDS=$((TOTAL_MINUTES * 60))
          DEADLINE=$(( $(date +%s) + TOTAL_SECONDS ))
          CHECK_NUMBER=0

          term_handler() {
            echo 'Cancellation / Stop signal caught! Moving directly to persistent saving...'
            exit 0
          }
          trap term_handler SIGTERM SIGINT

          while (( $(date +%s) < DEADLINE )); do
            CHECK_NUMBER=$((CHECK_NUMBER + 1))
            MEMORY="$(free -h | awk '/^Mem:/ {print $3 "/" $2}')"
            DISK="$(df -h / | awk 'NR==2 {print $4 " free"}')"
            LOAD="$(awk '{print $1}' /proc/loadavg)"
            REMAINING_SECONDS=$((DEADLINE - $(date +%s)))
            (( REMAINING_SECONDS < 0 )) && REMAINING_SECONDS=0
            REMAINING_MINUTES=$(( (REMAINING_SECONDS + 59) / 60 ))
            echo "[$CHECK_NUMBER] Remaining=${REMAINING_MINUTES}m | RAM=$MEMORY | Disk=$DISK | Load=$LOAD"
            sleep 60 &
            wait $! || true
          done

      - name: '10. Save data to persistent Git storage branch'
        if: ${{ always() || cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TARGET_DIR="/debian-root"
          echo '=== Saving persistent Debian data to branch runner-storage ==='
          GIT_DIR="/tmp/git-sync"
          rm -rf "$GIT_DIR"
          mkdir -p "$GIT_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" -b runner-storage "$GIT_DIR" 2>/dev/null; then
            cd "$GIT_DIR"
          else
            cd "$GIT_DIR"
            git init
            git checkout -b runner-storage
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          fi

          mkdir -p "$GIT_DIR/projects"
          if sudo test -d "$TARGET_DIR/root/projects"; then
            sudo cp -a "$TARGET_DIR/root/projects/." "$GIT_DIR/projects/" 2>/dev/null || true
          fi

          mkdir -p "$GIT_DIR/.hermes"
          if sudo test -d "$TARGET_DIR/root/.hermes"; then
            sudo cp -a "$TARGET_DIR/root/.hermes/config.yaml" "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a "$TARGET_DIR/root/.hermes/.env" "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a "$TARGET_DIR/root/.hermes/memories" "$GIT_DIR/.hermes/" 2>/dev/null || true
            sudo cp -a "$TARGET_DIR/root/.hermes/skills" "$GIT_DIR/.hermes/" 2>/dev/null || true
          fi

          echo "Last run completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC') by run #${{ github.run_number }} (Debian 5TB)" > "$GIT_DIR/LAST_RUN.txt"

          sudo chown -R "$(id -u):$(id -g)" "$GIT_DIR"
          cd "$GIT_DIR"
          git add -A

          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Auto-save Debian root state from run #${{ github.run_number }}" || true
            git push -u origin runner-storage --force || true
            echo 'Persistent Debian root data saved to runner-storage branch!'
          else
            echo 'Storage already up to date.'
          fi

      - name: '11. Compress and save complete Debian root cache'
        if: ${{ always() || cancelled() }}
        id: prepare-cache
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="/debian-root"
          ARCHIVE='${{ runner.temp }}/root-archive.tar.zst'
          rm -f "$ARCHIVE"

          echo 'Compressing Debian /root state with zstd (excluding cloud mount)...'
          sudo tar -I 'zstd -3 -T0' --exclude="$TARGET_DIR/root/gdrive" --exclude="$TARGET_DIR/root/.cache" -cf "$ARCHIVE" -C "$TARGET_DIR" root || true
          echo "Archive created: $(ls -lh "$ARCHIVE" | awk '{print $5}')"

      - name: '12. Save Actions Cache'
        if: ${{ always() || cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/root-archive.tar.zst
          key: debian-root-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: '13. Auto-restart workflow (if enabled)'
        if: ${{ always() && inputs.auto_restart == 'yes' && !cancelled() }}
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          WF_FILE="Ubunutu.yml"
          echo "Triggering auto-restart of $WF_FILE..."
          curl -sS -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"keep_alive_minutes\":\"${{ inputs.keep_alive_minutes }}\",\"auto_restart\":\"yes\"}}" || true
