_config_version: 51
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
attachments:
  storage: hermes-home
plugins:
  clone_timeout_seconds: 300
model:
  default: ag/gemini-3.8-flash
  provider: custom
  base_url: https://ai.velqon.ir/v1
  api_key: ${HERMES_CUSTOM_AI_VELQON_IR_API_KEY}
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  process_wait_auto_notify: true
  client_env_passthrough: []
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  backend: browser-use
  cloud_provider: local
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: null
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  prefetch_spill_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
max_concurrent_sessions: null
group_sessions_per_user: true
streaming:
  enabled: false
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
gateway:
  unmanaged_idle_exit_seconds: 600
  signal_interrupt_grace_timeout: 1
  service_install_choice: install
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - a2a
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
    timeout: 60
    max_retries: 1
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
display:
  compact: false
  cleanup_progress: false
  suppress_warning_notifications: false
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  streaming: true
  skin: default
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
custom_providers:
  - name: aws
    base_url: https://ai.velqon.ir/v1
    key_env: HERMES_CUSTOM_AI_VELQON_IR_API_KEY
    model: ag/gemini-3.8-flash
    models:
      claude-sonnet-4-6: {}
      Normal: {}
      Best: {}
      gemini/gemini-4-argon: {}
      gemini/gemini-3.8-flash: {}
      gemini/gemini-3.7-flash: {}
      gemini/gemini-3.6-flash: {}
      ag/gemini-4-argon-high: {}
      ag/gemini-3.8-flash-high: {}
      ag/gemini-3.8-flash-medium: {}
      ag/gemini-3.8-flash-low: {}
      ag/gemini-3.8-flash: {}
      ag/claude-sonnet-4-6: {}
      ag/claude-opus-4-6-thinking: {}
      ag/gpt-oss-120b-medium: {}
      agnes/agnes-2.5-flash: {}
      agnes/agnes-2.5-pro: {}
      agnes/agnes-2.5-pro-beta: {}
      agnes/agnes-3.0-flash: {}
      nous/meituan/longcat-2.5-preview:free: {}
      nous/stepfun/step-5-preview:free: {}
      nous/upstage/solar-mini4:free: {}
      nous/stepfun/step-3.7-flash:free: {}
      nous/poolside/laguna-xs-2.1:free: {}
      ollama/gpt-oss:120b: {}
      ollama/gemma4:31b-cloud: {}
      openrouter/typesafe/jev-1.13: {}
      mmf/mimo-auto: {}
      oc/muse-spark-1.2-contributor-free: {}
      oc/muse-spark-1.3-contributor-free: {}
      oc/union-alpha: {}
      oc/jev-1.13-free: {}
      oc/glm-5.3-flash-free: {}
      oc/deepseek-v4.1-flash-free: {}
      oc/longcat-2.5-preview-free: {}
      oc/mimo-v2.6-flash-free: {}
      oc/nemotron-3.5-super-vl-free: {}
    models_discovered: true
computer_use:
  backend: cua
